[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipora"
version = "0.1.0"
description = "Autonomous AI video clipping, reframing, and publishing engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "slowapi>=0.1.9",
    "google-genai>=0.1.1",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "yt-dlp>=2024.3.10",
    "json-repair>=0.25.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
heavy = [
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "scenedetect[opencv]>=0.6.2",
    "ultralytics>=8.1.0",
    "mediapipe>=0.10.11",
    "faster-whisper>=1.0.0",
    "curl-cffi>=0.6.2",
]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests requiring native CV/ML frameworks or external services (deselect with '-m \"not integration\"')",
]
